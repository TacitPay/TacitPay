<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Private, provable invoice settlement on Midnight." />
    <!-- The mark is the product: a public disc, a shielded ring, one verified
         node. The SVG carries its own dark-mode palette, so the tab icon
         inverts with the browser theme instead of vanishing on a dark strip.
         The PNG is the fallback for browsers that ignore SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <!-- Fonts are bundled from @fontsource and served from this origin. The page
         makes no third-party request at all, so visiting an invoice link tells
         nobody but the host that it happened. See src/index.css. -->
    <title>TacitPay — private invoicing on Midnight</title>
    <script>
      // Stamp an explicit theme choice before first paint, or the page renders
      // light for a frame and then flips. "system" stores nothing, so there is
      // nothing to stamp and the media query in index.css owns it. Keep the key
      // in step with src/lib/theme.ts.
      try {
        var tpTheme = localStorage.getItem('tacitpay:theme');
        if (tpTheme === 'light' || tpTheme === 'dark')
          document.documentElement.dataset.theme = tpTheme;
      } catch (tpError) {
        // Blocked site data: follow the system, which needs no stamp.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
