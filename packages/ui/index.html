<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Private, provable invoice settlement on Midnight." />
    <!-- The mark is the product: a public disc, a shielded ring, one verified
         node. The SVG carries its own dark-mode palette, so the tab icon
         inverts with the browser theme instead of vanishing on a dark strip.
         The PNG is the fallback for browsers that ignore SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Dark is the default; the pre-paint script below flips this to the light
         value only when a stored explicit choice says so. -->
    <meta name="theme-color" content="#09090b" />
    <!-- Fonts are bundled from @fontsource and served from this origin. The page
         makes no third-party request at all, so visiting an invoice link tells
         nobody but the host that it happened. See src/index.css. -->
    <title>TacitPay — private invoicing on Midnight</title>
    <script>
      // Dark is the default. Stamp it before first paint so the page never
      // renders light for a frame and then flips. Only a stored explicit
      // 'light' choice overrides it — a first visit, a private window and
      // blocked site data all land on dark. Keep the key and the default in
      // step with src/lib/theme.ts.
      var tpTheme = null;
      try {
        tpTheme = localStorage.getItem('tacitpay:theme');
      } catch (tpError) {
        // Blocked site data: fall through to the dark default.
      }
      var tpDark = tpTheme !== 'light';
      document.documentElement.dataset.theme = tpDark ? 'dark' : 'light';
      var tpMeta = document.querySelector('meta[name="theme-color"]');
      if (tpMeta) tpMeta.setAttribute('content', tpDark ? '#09090b' : '#fafafa');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
