<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    TacitPay favicon. Same three shapes as the logo component, the GitHub
    avatar and the social card: a public-ledger disc, a shielded ring, and the
    settlement node where they meet.

    It carries its own dark tile rather than sitting on the tab background.
    A transparent favicon has to guess the strip colour, and prefers-color-scheme
    is the wrong signal for that — it follows the OS theme, not the browser
    chrome, so the two disagree often enough that a near-black disc ends up
    invisible on a light strip (or the inverse). A fixed tile is legible
    everywhere and matches avatar-dark.png, so every surface shows one mark.

    Optically tuned for 16px: the ring is thicker and lighter than the logo's,
    and the node is enlarged, so all three shapes still separate at tab size.
  -->
  <rect width="32" height="32" rx="6" fill="#09090b" />
  <circle cx="19.5" cy="16" r="7.5" fill="none" stroke="#a1a1aa" stroke-width="2.6" />
  <circle cx="12.5" cy="16" r="7.5" fill="#fafafa" />
  <circle cx="16" cy="16" r="2.6" fill="#09090b" />
</svg>
