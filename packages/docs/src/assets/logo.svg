  <circle cx="20" cy="20" r="2.25" fill="#ffffff"/>
  <text x="50" y="20" dominant-baseline="central" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" letter-spacing="-0.4">
    <tspan font-weight="600" fill="#09090b">Tacit</tspan><tspan font-weight="400" fill="#71717a">Pay</tspan>
  </text>
</svg>
