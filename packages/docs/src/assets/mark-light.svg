<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 10 28 20" fill="none">
  <!-- The TacitPay mark on a light ground, same three shapes as the Logo
       component: shielded ring, public-ledger disc, settlement node.
       Hero-scale tuning: the ring's stroke is thinner than the 30px logo's,
       and its radius is pulled in so stroke's outer edge lands exactly on
       the disc's silhouette — at this size a straddling stroke reads as a
       bigger, heavier circle. -->
  <circle cx="24" cy="20" r="8.35" stroke="#a1a1aa" stroke-width="1.3" />
  <circle cx="16" cy="20" r="9" fill="#09090b" />
  <circle cx="20" cy="20" r="2.25" fill="#fafafa" />
</svg>
